    <script>
      // Apply the saved theme before first paint. ThemeToggle only sets data-theme in
      // a useEffect, so without this a dark-theme user gets a white flash on every load.
      // 'chordica-theme-v2' is a FROZEN identifier (src/identifiers.ts); index.html
      // cannot import it, so src/identifiers.test.ts asserts this literal stays in sync.
      try {
        if (localStorage.getItem('chordica-theme-v2') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) { /* private mode / storage disabled */ }
    </script>
