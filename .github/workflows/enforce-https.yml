name: Enforce HTTPS

on:
  push:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS when the certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PUT "repos/${{ github.repository }}/pages" -f https_enforced=true; then
            echo 'HTTPS is enforced.'
          else
            echo 'Certificate is not ready yet; this workflow will try again.'
          fi
